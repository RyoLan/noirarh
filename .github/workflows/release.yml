name: Release

# Push a tag such as v0.1.0 to build every installer and attach them to a GitHub Release.
# Optional secrets: NPM_TOKEN (publish the CLI to npm), CSC_LINK + CSC_KEY_PASSWORD (code signing),
# APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (macOS notarization).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  agent:
    name: npm package
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w agent
      - run: npm test -w agent
      - run: mkdir -p out && npm pack -w agent --pack-destination out
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: out/*.tgz
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != ''
        run: npm publish -w agent --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w agent
      - run: npm run dist:win -w desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/release/Noira-Setup.exe

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w agent
      - name: Build the disk image
        shell: bash
        run: |
          extra=""
          if [ -z "$CSC_LINK" ]; then
            # no certificate: build unsigned instead of attempting to sign or notarize
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            extra="-c.mac.identity=null"
          fi
          set -o pipefail
          if ! npm run dist:mac -w desktop -- $extra 2>&1 | tee build.log; then
            node .github/scripts/annotate-log.mjs build.log "dist:mac failed"
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: desktop/release/Noira-mac.dmg

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build -w agent
      - run: npm run add -w mobile
      - name: App icons
        run: npm run icons -w mobile
        continue-on-error: true
      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Noira-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Noira-android.apk

  release:
    name: GitHub Release
    needs: [agent, windows, macos, android]
    # publish whatever was built, so one failing platform does not hold back the others
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Noira-Setup.exe
            artifacts/Noira-mac.dmg
            artifacts/Noira-android.apk
            artifacts/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: false
