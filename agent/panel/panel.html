<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noira · Control panel</title>
<meta name="description" content="Your self-hosted Noira agent: chat, approvals, jobs, memory and settings.">
<meta name="theme-color" content="#07040f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!--NOIRA_BOOT-->
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g stroke-width="1.7" stroke-linecap="round"><line x1="13.06" y1="5.6" x2="13.16" y2="5.6" stroke="currentColor" stroke-opacity="0.3"/><line x1="15.06" y1="5.6" x2="18.32" y2="5.6" stroke="currentColor"/><line x1="7.65" y1="8.2" x2="10.02" y2="8.2" stroke="currentColor" stroke-opacity="0.3"/><line x1="11.92" y1="8.2" x2="16.75" y2="8.2" stroke="currentColor"/><line x1="6.69" y1="10.8" x2="8.33" y2="10.8" stroke="currentColor" stroke-opacity="0.3"/><line x1="10.23" y1="10.8" x2="15.91" y2="10.8" stroke="currentColor"/><line x1="6.51" y1="13.4" x2="7.43" y2="13.4" stroke="currentColor" stroke-opacity="0.3"/><line x1="9.33" y1="13.4" x2="15.64" y2="13.4" stroke="currentColor"/><line x1="6.96" y1="16" x2="7.14" y2="16" stroke="currentColor" stroke-opacity="0.3"/><line x1="9.04" y1="16" x2="15.92" y2="16" stroke="currentColor"/><line x1="4.97" y1="18.6" x2="7.43" y2="18.6" stroke="currentColor" stroke-opacity="0.3"/><line x1="9.33" y1="18.6" x2="16.78" y2="18.6" stroke="currentColor"/><line x1="6.6" y1="21.2" x2="8.33" y2="21.2" stroke="currentColor" stroke-opacity="0.3"/><line x1="10.23" y1="21.2" x2="18.38" y2="21.2" stroke="currentColor"/><line x1="9.02" y1="23.8" x2="10.02" y2="23.8" stroke="currentColor" stroke-opacity="0.3"/><line x1="11.92" y1="23.8" x2="21.19" y2="23.8" stroke="currentColor"/><line x1="12.88" y1="26.4" x2="13.16" y2="26.4" stroke="currentColor" stroke-opacity="0.3"/><line x1="15.06" y1="26.4" x2="27.03" y2="26.4" stroke="currentColor"/></g></svg>
      <span>Noira</span>
    </div>
    <nav class="tabs" aria-label="Panel">
      <button data-view="chat" aria-current="page"><span class="ic">◐</span><span>Chat</span></button>
      <button data-view="approvals"><span class="ic">✓</span><span>Approvals</span><b class="badge" id="apBadge" hidden>0</b></button>
      <button data-view="activity"><span class="ic">≋</span><span>Activity</span></button>
      <button data-view="jobs"><span class="ic">◷</span><span>Jobs</span></button>
      <button data-view="memory"><span class="ic">◈</span><span>Memory</span></button>
      <button data-view="files"><span class="ic">▤</span><span>Files</span></button>
      <button data-view="settings"><span class="ic">⚙</span><span>Settings</span></button>
    </nav>
    <div class="side-foot">
      <div class="gw" id="gwState"><i></i><span>Connecting…</span></div>
      <button class="install" id="installBtn" hidden>Install app</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
