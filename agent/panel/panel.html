<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noira · Control panel</title>
<meta name="description" content="Your self-hosted Noira agent: chat, approvals, jobs, memory and settings.">
<meta name="theme-color" content="#07040f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!--NOIRA_BOOT-->
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g stroke-width="1.9" stroke-linecap="round"><line x1="9.38" y1="5.85" x2="9.48" y2="5.85" stroke="currentColor" stroke-opacity="0.3"/><line x1="11.38" y1="5.85" x2="15.81" y2="5.85" stroke="currentColor"/><line x1="4.44" y1="8.75" x2="6.81" y2="8.75" stroke="currentColor" stroke-opacity="0.3"/><line x1="8.71" y1="8.75" x2="14.61" y2="8.75" stroke="currentColor"/><line x1="3.71" y1="11.65" x2="5.35" y2="11.65" stroke="currentColor" stroke-opacity="0.3"/><line x1="7.25" y1="11.65" x2="14.31" y2="11.65" stroke="currentColor"/><line x1="3.77" y1="14.55" x2="4.68" y2="14.55" stroke="currentColor" stroke-opacity="0.3"/><line x1="6.58" y1="14.55" x2="14.8" y2="14.55" stroke="currentColor"/><line x1="4.5" y1="17.45" x2="4.68" y2="17.45" stroke="currentColor" stroke-opacity="0.3"/><line x1="6.58" y1="17.45" x2="16.24" y2="17.45" stroke="currentColor"/><line x1="2.89" y1="20.35" x2="5.35" y2="20.35" stroke="currentColor" stroke-opacity="0.3"/><line x1="7.25" y1="20.35" x2="19.29" y2="20.35" stroke="currentColor"/><line x1="5.08" y1="23.25" x2="6.81" y2="23.25" stroke="currentColor" stroke-opacity="0.3"/><line x1="8.71" y1="23.25" x2="30.29" y2="23.25" stroke="currentColor"/><line x1="8.48" y1="26.15" x2="9.48" y2="26.15" stroke="currentColor" stroke-opacity="0.3"/><line x1="11.38" y1="26.15" x2="27.62" y2="26.15" stroke="currentColor"/></g></svg>
      <span>Noira</span>
    </div>
    <nav class="tabs" aria-label="Panel">
      <button data-view="chat" aria-current="page"><span class="ic">◐</span><span>Chat</span></button>
      <button data-view="approvals"><span class="ic">✓</span><span>Approvals</span><b class="badge" id="apBadge" hidden>0</b></button>
      <button data-view="activity"><span class="ic">≋</span><span>Activity</span></button>
      <button data-view="jobs"><span class="ic">◷</span><span>Jobs</span></button>
      <button data-view="memory"><span class="ic">◈</span><span>Memory</span></button>
      <button data-view="files"><span class="ic">▤</span><span>Files</span></button>
      <button data-view="settings"><span class="ic">⚙</span><span>Settings</span></button>
    </nav>
    <div class="side-foot">
      <div class="gw" id="gwState"><i></i><span>Connecting…</span></div>
      <button class="install" id="installBtn" hidden>Install app</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
